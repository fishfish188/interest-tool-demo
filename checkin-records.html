<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部打卡/记录</title>
  <style>
    @font-face { font-family: "JiangChengYuanTi"; src: url("assets/fonts/JiangChengYuanTi-400.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "JiangChengYuanTi"; src: url("assets/fonts/JiangChengYuanTi-500.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: "JiangChengYuanTi"; src: url("assets/fonts/JiangChengYuanTi-600.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }
    :root { --page: #FDF5EA; --ink: #100F0F; --yellow: #FCD611; --green: #CDF12D; --card-border: 2px solid #100F0F; --card-shadow: 2px 2px 0 #100F0F; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; background: var(--page); color: var(--ink); font-family: "JiangChengYuanTi", YouYuan, "幼圆", sans-serif; letter-spacing: 0; }
    body { display: flex; justify-content: center; overflow-x: hidden; }
    button, input, textarea { color: inherit; font: inherit; border: 0; background: none; outline: none; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }
    .page { position: relative; width: 430px; height: 932px; flex: 0 0 430px; overflow: hidden; transform-origin: top center; background: linear-gradient(180deg, rgba(205, 241, 45, 0.7) 0%, #FDF5EA 100%); }
    .page > :not(.record-overlay):not(.back-link) { translate: 0 22px; }
    .back-link { position: absolute; left: 16px; top: 50px; width: 92px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--page); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: 8px; font-weight: 500; font-size: 18px; line-height: 18px; z-index: 2; }
    .back-link img { width: 20px; height: 20px; }
    .sheet { position: absolute; left: 0; top: 171px; width: 430px; height: 761px; background: var(--page); border-radius: 16px 16px 0 0; }
    .week-nav { position: absolute; left: 16px; top: 123px; width: 156px; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: rgba(253, 245, 234, 0.85); border-radius: 8px; font-weight: 500; font-size: 16px; line-height: 16px; }
    .week-nav button { width: 16px; height: 16px; }
    .week-nav img { width: 16px; height: 16px; }
    .back-week { position: absolute; left: 322px; top: 123px; width: 88px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(253, 245, 234, 0.85); border-radius: 8px; font-weight: 500; font-size: 16px; line-height: 16px; }
    .calendar-grid { position: absolute; left: 16px; top: 187px; display: grid; grid-template-columns: repeat(7, 46px); gap: 12px; }
    .calendar-day { width: 46px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #FFFFFF; border: 1px solid #949494; border-radius: 8px; font-weight: 500; }
    .calendar-day span { font-size: 14px; line-height: 14px; }
    .calendar-day strong { font-weight: 600; font-size: 14px; line-height: 14px; }
    .calendar-day.is-today { background: #FFFFFF; border: 1px solid #100F0F; border-radius: 8px; }
    .calendar-day.is-done { background: var(--green); border: var(--card-border); box-shadow: var(--card-shadow); }
    .records { position: absolute; left: 16px; top: 261px; display: grid; gap: 16px; }
    .record-card { position: relative; width: 398px; min-height: 90px; padding: 12px 56px 12px 16px; background: #FFFFFF; border-radius: 12px; }
    .record-date, .record-time { position: absolute; left: 16px; height: 14px; color: #949494; font-weight: 500; font-size: 14px; line-height: 14px; }
    .record-date { top: 12px; }
    .record-time { top: 32px; }
    .record-title { margin-left: 57px; height: 16px; font-weight: 600; font-size: 16px; line-height: 16px; }
    .record-text { margin: 8px 0 0 57px; width: 267px; color: #949494; font-weight: 500; font-size: 14px; line-height: 21px; }
    .edit-button { position: absolute; right: 16px; top: 8px; width: 24px; height: 24px; }
    .edit-button img { width: 24px; height: 24px; opacity: 0.75; }
    .add-record { position: absolute; left: 40px; top: 493px; width: 350px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--yellow); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: 8px; font-weight: 500; font-size: 16px; line-height: 16px; }
    .record-overlay { position: fixed; left: 50%; top: 0; width: 430px; height: 932px; transform: translateX(-50%); z-index: 20; }
    .record-overlay[hidden] { display: none; }
    .record-mask { position: absolute; width: 430px; height: 932px; left: 0; top: 0; background: rgba(217, 217, 217, 0.6); }
    .record-sheet { position: absolute; left: 0; top: 171px; width: 430px; height: 761px; background: var(--page); border-radius: 16px 16px 0 0; }
    .record-title-label, .record-content-label { position: absolute; left: 16px; height: 16px; font-weight: 500; font-size: 16px; line-height: 16px; }
    .record-title-label { top: 24px; }
    .record-content-label { top: 108px; }
    .record-title-input, .record-content-input { position: absolute; left: 16px; width: 398px; padding: 0 16px; background: #FFFFFF; border: var(--card-border); box-shadow: var(--card-shadow); border-radius: 12px; font-weight: 500; font-size: 14px; line-height: 14px; }
    .record-title-input { top: 50px; height: 42px; }
    .record-content-input { top: 134px; height: 303px; padding-top: 14px; resize: none; line-height: 20px; }
    .record-title-input::placeholder, .record-content-input::placeholder { color: #949494; }
    .record-cancel-button, .record-confirm-button { position: absolute; top: 577px; width: 175px; height: 48px; display: flex; align-items: center; justify-content: center; border: var(--card-border); box-shadow: var(--card-shadow); border-radius: 8px; font-weight: 500; font-size: 16px; line-height: 16px; }
    .record-cancel-button { left: 32px; background: var(--page); }
    .record-confirm-button { left: 223px; background: var(--yellow); }
    .action-tip { position: absolute; left: calc(50% - 78px / 2); width: 78px; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(16, 15, 15, 0.7); border: 1px solid rgba(16, 15, 15, 0.7); border-radius: 8px; text-align: center; font-weight: 400; font-size: 14px; line-height: 14px; color: #FFFFFF; z-index: 4; }
    .action-tip[hidden] { display: none; }
    @media (max-width: 430px) { .page { transform: scale(calc(100vw / 430)); } body { height: calc(932px * (100vw / 430)); } }
  </style>
</head>
<body>
  <main class="page" aria-label="全部打卡/记录">
    <a class="back-link" href="detail-climbing.html?source=mine&status=ing&fresh=sync2">
      <img src="assets/icon-arrow-left-s-line.svg" alt="" aria-hidden="true">
      <span>返回</span>
    </a>
    <div class="week-nav" aria-label="周区间">
      <button class="prev-week" type="button" aria-label="上一周"><img src="assets/icon-arrow-left-s-line.svg" alt="" aria-hidden="true"></button>
      <span class="week-range">9/28-10/4</span>
      <button class="next-week" type="button" aria-label="下一周"><img src="assets/icon-arrow-right-s-line.svg" alt="" aria-hidden="true"></button>
    </div>
    <button class="back-week" type="button">回到本周</button>
    <section class="sheet" aria-label="全部打卡记录"></section>
    <div class="calendar-grid" aria-label="本周日期"></div>
    <section class="records" aria-label="记录列表">
      <article class="record-card">
        <span class="record-date">09/28</span>
        <span class="record-time">19:30</span>
        <h2 class="record-title">攀岩练习</h2>
        <p class="record-text">上了一节体验课，教了基础抓提，但不很敢爬，就怕摔下来，回去得学习下怎么落地先</p>
        <button class="edit-button" type="button" aria-label="编辑记录">
          <img src="assets/icon-edit-2-line.svg" alt="" aria-hidden="true">
        </button>
      </article>
      <article class="record-card">
        <span class="record-date">10/01</span>
        <span class="record-time">19:30</span>
        <h2 class="record-title">动作要点复盘</h2>
        <p class="record-text">摔得时候不要手撑地，切记切记切记！老是习惯手撑地！</p>
        <button class="edit-button" type="button" aria-label="编辑记录">
          <img src="assets/icon-edit-2-line.svg" alt="" aria-hidden="true">
        </button>
      </article>
    </section>
    <button class="add-record" type="button">添加记录</button>
    <div class="action-tip" role="status" aria-live="polite" hidden></div>
    <div class="record-overlay" hidden>
      <div class="record-mask" aria-hidden="true"></div>
      <section class="record-sheet" aria-label="编辑打卡记录">
        <label class="record-title-label" for="record-title">标题</label>
        <input class="record-title-input" id="record-title" type="text" placeholder="请输入...">
        <label class="record-content-label" for="record-content">内容</label>
        <textarea class="record-content-input" id="record-content" aria-label="内容" placeholder="请输入..."></textarea>
        <button class="record-cancel-button" type="button">取消</button>
        <button class="record-confirm-button" type="button">确认</button>
      </section>
    </div>
  </main>
  <script>
    const interestName = "攀岩";
    const checkinDaysKey = `interestCalendarDays:${interestName}`;
    const recordsKey = `interestCheckinRecords:${interestName}`;
    const defaultRecords = [
      {
        date: "09/28",
        time: "19:30",
        title: "攀岩练习",
        text: "上了一节体验课，教了基础抓提，但不很敢爬，就怕摔下来，回去得学习下怎么落地先"
      },
      {
        date: "10/01",
        time: "19:30",
        title: "动作要点复盘",
        text: "摔得时候不要手撑地，切记切记切记！老是习惯手撑地！"
      }
    ];
    let weekOffset = 0;
    let editingCard = null;

    function toISO(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function getCurrentMonday() {
      const today = new Date();
      const monday = new Date(today);
      monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function getWeek(offset = 0) {
      const dayNames = ["一", "二", "三", "四", "五", "六", "日"];
      const monday = getCurrentMonday();
      monday.setDate(monday.getDate() + offset * 7);
      return dayNames.map((day, index) => {
        const date = new Date(monday);
        date.setDate(monday.getDate() + index);
        return {
          day,
          date: String(date.getDate()).padStart(2, "0"),
          label: `${date.getMonth() + 1}/${date.getDate()}`,
          iso: toISO(date)
        };
      });
    }

    function readSharedJSON(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        if (value) return JSON.parse(value);
      } catch (error) {
        // Cookie fallback keeps state shared when preview storage is restricted.
      }
      const cookieKey = key.replace(/[^a-zA-Z0-9_-]/g, "_");
      const cookie = document.cookie.split("; ").find((item) => item.startsWith(`${cookieKey}=`));
      if (!cookie) return fallback;
      try {
        return JSON.parse(cookie.split("=").slice(1).join("="));
      } catch (error) {
        return fallback;
      }
    }

    function writeSharedJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // Keep going with the cookie fallback below.
      }
      const cookieKey = key.replace(/[^a-zA-Z0-9_-]/g, "_");
      document.cookie = `${cookieKey}=${JSON.stringify(value)}; path=/; max-age=31536000`;
    }

    function readCheckinDays() {
      return readSharedJSON(checkinDaysKey, []);
    }

    function writeCheckinDays(days) {
      writeSharedJSON(checkinDaysKey, days);
    }

    function readRecords() {
      const records = readSharedJSON(recordsKey, []);
      return records.length ? records : defaultRecords;
    }

    function writeRecords(records) {
      writeSharedJSON(recordsKey, records);
    }

    function renderWeek() {
      const week = getWeek(weekOffset);
      const doneDays = readCheckinDays();
      const todayISO = toISO(new Date());
      document.querySelector(".week-range").textContent = `${week[0].label}-${week[6].label}`;
      document.querySelector(".calendar-grid").innerHTML = week.map((item) => `
      <button class="calendar-day ${item.iso === todayISO ? "is-today" : ""} ${doneDays.includes(item.iso) ? "is-done" : ""}" type="button" data-date="${item.iso}">
        <span>${item.day}</span>
        <strong>${item.date}</strong>
      </button>
    `).join("");
    }

    function createRecordCard(record) {
      const card = document.createElement("article");
      card.className = "record-card";
      card.innerHTML = `
        <span class="record-date"></span>
        <span class="record-time"></span>
        <h2 class="record-title"></h2>
        <p class="record-text"></p>
        <button class="edit-button" type="button" aria-label="编辑记录">
          <img src="assets/icon-edit-2-line.svg" alt="" aria-hidden="true">
        </button>`;
      card.querySelector(".record-date").textContent = record.date || "今天";
      card.querySelector(".record-time").textContent = record.time || "刚刚";
      card.querySelector(".record-title").textContent = record.title || "攀岩练习";
      card.querySelector(".record-text").textContent = record.text || "";
      return card;
    }

    function readPageRecords() {
      return Array.from(document.querySelectorAll(".record-card")).map((card) => ({
        date: card.querySelector(".record-date")?.textContent || "今天",
        time: card.querySelector(".record-time")?.textContent || "刚刚",
        title: card.querySelector(".record-title")?.textContent || "攀岩练习",
        text: card.querySelector(".record-text")?.textContent || ""
      }));
    }

    function renderRecords() {
      const list = document.querySelector(".records");
      list.innerHTML = "";
      readRecords().forEach((record) => list.appendChild(createRecordCard(record)));
    }

    function openRecordSheet(card) {
      editingCard = card;
      document.querySelector(".record-title-input").value = card?.querySelector(".record-title")?.textContent || "";
      document.querySelector(".record-content-input").value = card?.querySelector(".record-text")?.textContent || "";
      document.querySelector(".record-overlay").hidden = false;
      document.querySelector(".record-content-input").focus();
    }

    function closeRecordSheet() {
      document.querySelector(".record-overlay").hidden = true;
      editingCard = null;
    }

    function showActionTip(message, anchor) {
      const tip = document.querySelector(".action-tip");
      tip.textContent = message;
      tip.hidden = false;
      tip.style.left = "calc(50% - 78px / 2)";
      if (anchor) {
        const pageRect = document.querySelector(".page").getBoundingClientRect();
        const anchorRect = anchor.getBoundingClientRect();
        const scale = pageRect.width / 430 || 1;
        const top = ((anchorRect.top - pageRect.top) / scale) - 90;
        tip.style.top = `${Math.max(16, top)}px`;
      } else {
        tip.style.top = "158px";
      }
      window.clearTimeout(showActionTip.timer);
      showActionTip.timer = window.setTimeout(() => {
        tip.hidden = true;
      }, 1000);
    }

    document.querySelector(".prev-week").addEventListener("click", () => {
      weekOffset -= 1;
      renderWeek();
    });

    document.querySelector(".next-week").addEventListener("click", () => {
      weekOffset += 1;
      renderWeek();
    });

    document.querySelector(".back-week").addEventListener("click", () => {
      weekOffset = 0;
      renderWeek();
    });

    document.querySelector(".calendar-grid").addEventListener("click", (event) => {
      const day = event.target.closest(".calendar-day");
      if (!day) return;
      day.classList.add("is-done");
      const days = readCheckinDays();
      if (!days.includes(day.dataset.date)) {
        days.push(day.dataset.date);
        writeCheckinDays(days);
      }
      showActionTip("打卡成功", day);
    });

    document.querySelector(".records").addEventListener("click", (event) => {
      const button = event.target.closest(".edit-button");
      if (!button) return;
      openRecordSheet(button.closest(".record-card"));
    });

    document.querySelector(".add-record").addEventListener("click", () => openRecordSheet(null));
    document.querySelector(".record-cancel-button").addEventListener("click", closeRecordSheet);
    document.querySelector(".record-confirm-button").addEventListener("click", () => {
      const title = document.querySelector(".record-title-input").value.trim() || "攀岩练习";
      const text = document.querySelector(".record-content-input").value.trim() || "记录一下今天的小进展";
      if (editingCard) {
        editingCard.querySelector(".record-title").textContent = title;
        editingCard.querySelector(".record-text").textContent = text;
      } else {
        document.querySelector(".records").appendChild(createRecordCard({
          date: `${String(new Date().getMonth() + 1).padStart(2, "0")}/${String(new Date().getDate()).padStart(2, "0")}`,
          time: "刚刚",
          title,
          text
        }));
      }
      writeRecords(readPageRecords());
      closeRecordSheet();
    });

    document.querySelector(".back-link").addEventListener("click", (event) => {
      event.preventDefault();
      window.location.href = "detail-climbing.html?source=mine&status=ing&fresh=sync2";
    });

    function refreshPageState() {
      renderWeek();
      renderRecords();
    }

    window.addEventListener("pageshow", refreshPageState);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshPageState();
    });

    refreshPageState();
  </script>
</body>
</html>
