<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF5EA">
  <title>我的清单</title>
  <style>
    @font-face {
      font-family: "JiangChengYuanTi";
      src: url("assets/fonts/JiangChengYuanTi-400.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "JiangChengYuanTi";
      src: url("assets/fonts/JiangChengYuanTi-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "JiangChengYuanTi";
      src: url("assets/fonts/JiangChengYuanTi-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --page: #FDF5EA;
      --ink: #100F0F;
      --yellow: #FCD611;
      --label-yellow: #FDDE19;
      --green: #CDF12D;
      --blue: #10D8FD;
      --card-border: 2px solid #100F0F;
      --card-shadow: 2px 2px 0px #100F0F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: "JiangChengYuanTi", YouYuan, "幼圆", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button {
      color: inherit;
      font: inherit;
      border: 0;
      background: none;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .mine-page {
      position: relative;
      width: 430px;
      height: 932px;
      flex: 0 0 430px;
      overflow: hidden;
      transform-origin: top center;
    }

    .mine-page > :not(.mine-bg) {
      translate: 0 10px;
    }

    .mine-bg {
      position: absolute;
      width: 430px;
      height: 185px;
      left: 0;
      top: 0;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .brand-title {
      display: none;
      position: absolute;
      width: 200px;
      height: 40px;
      left: 42px;
      top: 24px;
      font-weight: 600;
      font-size: 40px;
      line-height: 40px;
      text-align: center;
      white-space: nowrap;
      z-index: 2;
    }

    .brand-subtitle {
      display: none;
      position: absolute;
      width: 198px;
      height: 18px;
      left: 43px;
      top: 80px;
      font-weight: 500;
      font-size: 18px;
      line-height: 18px;
      text-align: center;
      white-space: nowrap;
      z-index: 2;
    }

    .title-underline {
      display: none;
      position: absolute;
      width: 200.63px;
      height: 15.4px;
      left: 44.4px;
      top: 57.32px;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    .title-sparkles {
      display: none;
      position: absolute;
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
    }

    .title-sparkles-left {
      width: 63px;
      height: 63px;
      left: -6px;
      top: -3px;
    }

    .title-sparkles-right {
      width: 50px;
      height: 50px;
      left: 231px;
      top: 57px;
      transform: rotate(14.33deg);
    }

    .top-tabs {
      position: absolute;
      width: 136px;
      height: 40px;
      left: 278px;
      top: 28px;
      background: var(--page);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 8px;
      z-index: 3;
    }

    .back-link {
      position: absolute;
      left: 16px;
      top: 28px;
      width: 92px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--page);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 8px;
      font-weight: 500;
      font-size: 18px;
      line-height: 18px;
      z-index: 3;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .back-link img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .back-link span {
      width: 36px;
      height: 18px;
      line-height: 18px;
      text-align: center;
    }

    .top-tab {
      position: absolute;
      top: -2px;
      width: 68px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 500;
      font-size: 18px;
      line-height: 18px;
      text-align: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .top-tab-plaza {
      left: -2px;
      background: var(--yellow);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      z-index: 1;
    }

    .top-tab-mine {
      left: 68px;
    }

    .status-row {
      position: absolute;
      left: 0;
      top: 0;
      width: 430px;
      height: 212px;
    }

    .status-chip {
      position: absolute;
      width: 122px;
      height: 94px;
      top: 118px;
      background: transparent;
      border: 0;
      box-shadow: none;
      border-radius: 16px;
      font-weight: 500;
      overflow: visible;
      transition: transform 120ms ease;
    }

    .status-chip[data-status="try"] {
      left: 16px;
    }

    .status-chip[data-status="ing"] {
      left: 154px;
    }

    .status-chip[data-status="giveup"] {
      left: 292px;
    }

    .status-bg {
      position: absolute;
      width: 122px;
      height: 94px;
      left: 0;
      top: 0;
      background: var(--page);
      box-shadow: var(--card-shadow);
      border-radius: 16px;
      z-index: 0;
      pointer-events: none;
      transition: background 120ms ease;
    }

    .status-icon {
      position: absolute;
      width: 122px;
      height: 94px;
      left: 0;
      top: 0;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    .status-board {
      position: absolute;
      width: 122px;
      height: 94px;
      left: 0;
      top: 0;
      border: var(--card-border);
      border-radius: 16px;
      z-index: 2;
      pointer-events: none;
    }

    .status-chip[data-status="try"].is-active .status-bg {
      background: var(--label-yellow);
    }

    .status-chip[data-status="ing"].is-active .status-bg {
      background: var(--green);
    }

    .status-chip[data-status="giveup"].is-active .status-bg {
      background: var(--blue);
    }

    .status-name {
      position: absolute;
      left: 18px;
      top: 18px;
      width: 42px;
      height: 14px;
      font-weight: 500;
      font-size: 14px;
      line-height: 14px;
      text-align: left;
      z-index: 3;
    }

    .status-count {
      position: absolute;
      left: 18px;
      top: 40px;
      min-width: 20px;
      height: 32px;
      font-weight: 500;
      font-size: 32px;
      line-height: 32px;
      text-align: left;
      z-index: 3;
    }

    .saved-list {
      position: absolute;
      left: 16px;
      top: 228px;
      width: 398px;
      display: grid;
      gap: 16px;
    }

    .saved-card {
      position: relative;
      width: 398px;
      height: 138px;
      background: var(--page);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 16px;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .saved-icon {
      position: absolute;
      width: 139px;
      height: 139px;
      left: -10px;
      top: -1px;
      object-fit: contain;
    }

    .saved-title-row {
      position: absolute;
      left: 126px;
      top: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 18px;
    }

    .saved-title {
      font-weight: 600;
      font-size: 18px;
      line-height: 18px;
      white-space: nowrap;
    }

    .saved-status {
      height: 16px;
      padding: 2px 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--yellow);
      border-radius: 3px;
      font-weight: 500;
      font-size: 12px;
      line-height: 12px;
      white-space: nowrap;
    }

    .saved-status.green,
    .saved-tag.green {
      background: var(--green);
    }

    .saved-status.blue,
    .saved-tag.blue {
      background: var(--blue);
    }

    .saved-detail {
      position: absolute;
      left: 130px;
      top: 0;
      width: 268px;
      height: 76px;
      display: block;
    }

    .saved-detail > span {
      position: absolute;
      left: 180px;
      top: 22px;
      font-weight: 500;
      font-size: 14px;
      line-height: 14px;
    }

    .saved-detail img {
      position: absolute;
      left: 240px;
      top: 23px;
      width: 12px;
      height: 12px;
      object-fit: contain;
    }

    .saved-note {
      position: absolute;
      left: 126px;
      top: 50px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 14px;
      font-weight: 500;
      font-size: 14px;
      line-height: 14px;
    }

    .saved-note img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .saved-tags {
      position: absolute;
      left: 126px;
      top: 76px;
      display: flex;
      gap: 6px;
    }

    .saved-tag {
      height: 16px;
      padding: 2px 8px;
      background: var(--label-yellow);
      border-radius: 3px;
      font-weight: 400;
      font-size: 12px;
      line-height: 12px;
      white-space: nowrap;
    }

    .create-button {
      position: absolute;
      width: 350px;
      height: 48px;
      left: calc(50% - 350px / 2);
      top: 710px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--yellow);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 8px;
      font-weight: 500;
      font-size: 16px;
      line-height: 16px;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .top-tab:active,
    .back-link:active,
    .status-chip:active,
    .saved-card:active,
    .create-button:active {
      transform: translate(2px, 2px);
    }

    .top-tab:active,
    .back-link:active,
    .saved-card:active,
    .create-button:active {
      box-shadow: 0 0 0 #100F0F;
    }

    .saved-card.is-hidden {
      display: none;
    }

    .saved-card.is-deleted {
      display: none;
    }

    @media (max-width: 430px) {
      .mine-page {
        transform: scale(calc(100vw / 430));
      }

      body {
        height: calc(932px * (100vw / 430));
      }
    }
  </style>
</head>
<body>
  <main class="mine-page" aria-label="我的清单">
    <img class="mine-bg" src="assets/bg.webp" alt="" aria-hidden="true">
    <img class="title-sparkles title-sparkles-left" src="assets/deco-sparkles.webp" alt="" aria-hidden="true">
    <img class="title-sparkles title-sparkles-right" src="assets/deco-sparkles.webp" alt="" aria-hidden="true">
    <img class="title-underline" src="assets/line1.webp" alt="" aria-hidden="true">
    <h1 class="brand-title">兴趣探索站</h1>
    <p class="brand-subtitle">适合打工人的低成本指南</p>

    <a class="back-link" href="index.html">
      <img src="assets/icon-arrow-left-s-line.svg" alt="" aria-hidden="true">
      <span>返回</span>
    </a>

    <nav class="top-tabs" aria-label="顶部导航">
      <a class="top-tab top-tab-plaza" href="mine.html">我的</a>
      <a class="top-tab top-tab-mine" href="explore.html">广场</a>
    </nav>

    <section class="status-row" aria-label="清单状态筛选">
      <button class="status-chip" type="button" data-status="try">
        <span class="status-bg" aria-hidden="true"></span>
        <img class="status-icon" src="assets/try-icon.webp" alt="" aria-hidden="true">
        <span class="status-board" aria-hidden="true"></span>
        <span class="status-name">想尝试</span>
        <span class="status-count">1</span>
      </button>
      <button class="status-chip" type="button" data-status="ing">
        <span class="status-bg" aria-hidden="true"></span>
        <img class="status-icon" src="assets/ing-icon.webp" alt="" aria-hidden="true">
        <span class="status-board" aria-hidden="true"></span>
        <span class="status-name">进行中</span>
        <span class="status-count">1</span>
      </button>
      <button class="status-chip" type="button" data-status="giveup">
        <span class="status-bg" aria-hidden="true"></span>
        <img class="status-icon" src="assets/giveup-icon.webp" alt="" aria-hidden="true">
        <span class="status-board" aria-hidden="true"></span>
        <span class="status-name">已放弃</span>
        <span class="status-count">1</span>
      </button>
    </section>

    <section class="saved-list" aria-label="我的兴趣列表">
      <article class="saved-card" data-name="简笔画" data-status="try" data-tone="green">
        <img class="saved-icon" src="assets/icon-painting.webp" alt="" aria-hidden="true">
        <div class="saved-title-row">
          <h3 class="saved-title">简笔画</h3>
          <span class="saved-status">想尝试</span>
        </div>
        <a class="saved-detail" href="detail-painting.html?source=mine&status=try">
          <span>查看详情</span>
          <img src="assets/icon-arrow-right-s-line.svg" alt="" aria-hidden="true">
        </a>
        <p class="saved-note">启动资金：0-50元</p>
        <div class="saved-tags" aria-label="兴趣标签">
          <span class="saved-tag green">室内</span>
          <span class="saved-tag green">绘画</span>
          <span class="saved-tag green">1h/次</span>
        </div>
      </article>

      <article class="saved-card" data-name="攀岩" data-status="ing" data-tone="yellow">
        <img class="saved-icon" src="assets/icon-climbing.webp" alt="" aria-hidden="true">
        <div class="saved-title-row">
          <h3 class="saved-title">攀岩</h3>
          <span class="saved-status green">进行中</span>
        </div>
        <a class="saved-detail" href="detail-climbing.html?source=mine&status=ing">
          <span>查看详情</span>
          <img src="assets/icon-arrow-right-s-line.svg" alt="" aria-hidden="true">
        </a>
        <p class="saved-note">已打卡2天</p>
        <div class="saved-tags" aria-label="兴趣标签">
          <span class="saved-tag">室内/户外</span>
          <span class="saved-tag">无氧</span>
          <span class="saved-tag">1-1.5h/次</span>
        </div>
      </article>

      <article class="saved-card" data-name="拳击" data-status="giveup" data-tone="blue">
        <img class="saved-icon" src="assets/icon-boxing.webp" alt="" aria-hidden="true">
        <div class="saved-title-row">
          <h3 class="saved-title">拳击</h3>
          <span class="saved-status blue">已放弃</span>
        </div>
        <a class="saved-detail" href="detail-boxing.html?source=mine&status=giveup">
          <span>查看详情</span>
          <img src="assets/icon-arrow-right-s-line.svg" alt="" aria-hidden="true">
        </a>
        <p class="saved-note">启动资金：100-300元</p>
        <div class="saved-tags" aria-label="兴趣标签">
          <span class="saved-tag blue">室内</span>
          <span class="saved-tag blue">有氧</span>
          <span class="saved-tag blue">1h/次</span>
        </div>
      </article>
    </section>

    <a class="create-button" href="create-interest.html">创建兴趣</a>
  </main>
  <script>
    const statusButtons = document.querySelectorAll(".status-chip");
    const savedList = document.querySelector(".saved-list");
    const interestMeta = {
      "攀岩": {
        icon: "assets/icon-climbing.webp",
        detail: "detail-climbing.html",
        tone: "yellow",
        note: "启动资金：0-100元",
        activeNote: "已打卡2天",
        tags: ["室内/户外", "无氧", "1-1.5h/次"]
      },
      "简笔画": {
        icon: "assets/icon-painting.webp",
        detail: "detail-painting.html",
        tone: "green",
        note: "启动资金：0-50元",
        tags: ["室内", "绘画", "1h/次"]
      },
      "网球": {
        icon: "assets/icon-tennis.webp",
        detail: "detail-tennis.html",
        tone: "blue",
        note: "启动资金：200-500元",
        tags: ["室外", "有氧", "1-1.5h/次"]
      },
      "皮克球": {
        icon: "assets/icon-pickleball.webp",
        detail: "detail-pickleball.html",
        tone: "yellow",
        note: "启动资金：100-300元",
        tags: ["室内/户外", "有氧", "1h/次"]
      },
      "烘焙": {
        icon: "assets/icon-baking.webp",
        detail: "detail-baking.html",
        tone: "green",
        note: "启动资金：100-300元",
        tags: ["室内", "手作", "1.5h/次"]
      },
      "拳击": {
        icon: "assets/icon-boxing.webp",
        detail: "detail-boxing.html",
        tone: "blue",
        note: "启动资金：100-300元",
        tags: ["室内", "有氧", "1h/次"]
      },
      "Jazz": {
        icon: "assets/icon-dance.webp",
        detail: "detail-jazz.html",
        tone: "yellow",
        note: "启动资金：100-300元",
        tags: ["室内", "舞蹈", "1-1.5h/次"]
      }
    };
    const statusText = {
      try: "想尝试",
      ing: "进行中",
      giveup: "已放弃"
    };
    const statusClass = {
      try: "",
      ing: "green",
      giveup: "blue"
    };
    let activeStatus = "";

    function readSavedList() {
      return JSON.parse(localStorage.getItem("interestSavedList") || "[]");
    }

    function readDeletedNames() {
      return JSON.parse(localStorage.getItem("interestDeletedNames") || "[]");
    }

    function getSavedCards() {
      return Array.from(document.querySelectorAll(".saved-card"));
    }

    function getItemMeta(item) {
      return interestMeta[item.name] || {
        icon: item.icon || "assets/icon-test.webp",
        detail: item.detail || "#",
        tone: item.tone || "yellow",
        note: item.note || "启动资金：待补充",
        activeNote: item.activeNote || "已打卡0天",
        tags: item.tags || ["其他", item.time || "待定"]
      };
    }

    function createSavedCard(item) {
      const name = item.name;
      const status = item.status || "try";
      const meta = getItemMeta(item);
      if (!meta) return null;
      const article = document.createElement("article");
      article.className = "saved-card";
      article.dataset.name = name;
      article.dataset.status = status;
      article.dataset.tone = meta.tone;
      if (item.custom) article.dataset.custom = "true";
      article.innerHTML = `
        <img class="saved-icon" src="${meta.icon}" alt="" aria-hidden="true">
        <div class="saved-title-row">
          <h3 class="saved-title">${name}</h3>
          <span class="saved-status">想尝试</span>
        </div>
        <a class="saved-detail" href="${meta.detail === "#" ? `detail-custom.html?name=${encodeURIComponent(name)}&source=mine&status=${status}` : `${meta.detail}?source=mine&status=${status}`} ">
          <span>查看详情</span>
          <img src="assets/icon-arrow-right-s-line.svg" alt="" aria-hidden="true">
        </a>
        <p class="saved-note"></p>
        <div class="saved-tags" aria-label="兴趣标签">
          ${meta.tags.map((tag) => `<span class="saved-tag">${tag}</span>`).join("")}
        </div>`;
      return article;
    }

    function setCardStatus(card, status) {
      const name = card.dataset.name;
      const saved = readSavedList().find((item) => item.name === name);
      const meta = getItemMeta(saved || { name });
      card.dataset.status = status;
      card.dataset.tone = meta?.tone || card.dataset.tone || "yellow";

      const statusLabel = card.querySelector(".saved-status");
      statusLabel.textContent = statusText[status];
      statusLabel.className = `saved-status ${statusClass[status]}`.trim();

      const detail = card.querySelector(".saved-detail");
      if (detail && meta) {
        detail.href = meta.detail === "#"
          ? `detail-custom.html?name=${encodeURIComponent(name)}&source=mine&status=${status}`
          : `${meta.detail}?source=mine&status=${status}`;
      }

      const note = card.querySelector(".saved-note");
      if (note && meta) {
        note.textContent = status === "ing" ? (meta.activeNote || "已打卡0天") : meta.note;
      }

      card.querySelectorAll(".saved-tag").forEach((tag) => {
        tag.className = `saved-tag ${meta?.tone === "green" ? "green" : meta?.tone === "blue" ? "blue" : ""}`.trim();
      });
    }

    function syncSavedCards() {
      const deletedNames = readDeletedNames();
      const savedItems = readSavedList();

      savedItems.forEach((item) => {
        if (deletedNames.includes(item.name)) return;
        if (!document.querySelector(`.saved-card[data-name="${item.name}"]`)) {
          const card = createSavedCard(item);
          if (card) savedList.appendChild(card);
        }
      });

      getSavedCards().forEach((card) => {
        const saved = savedItems.find((item) => item.name === card.dataset.name);
        const deleted = deletedNames.includes(card.dataset.name);
        card.classList.toggle("is-deleted", deleted);
        if (!deleted) {
          setCardStatus(card, saved?.status || card.dataset.status || "try");
        }
      });
    }

    function updateStatusCounts() {
      statusButtons.forEach((button) => {
        const count = getSavedCards().filter((card) => !card.classList.contains("is-deleted") && card.dataset.status === button.dataset.status).length;
        button.querySelector(".status-count").textContent = count;
      });
    }

    function applyStatusFilter() {
      getSavedCards().forEach((card) => {
        const hiddenByStatus = Boolean(activeStatus) && card.dataset.status !== activeStatus;
        card.classList.toggle("is-hidden", card.classList.contains("is-deleted") || hiddenByStatus);
      });
      layoutCreateButton();
    }

    function layoutCreateButton() {
      const createButton = document.querySelector(".create-button");
      const visibleCards = getSavedCards().filter((card) => !card.classList.contains("is-hidden") && !card.classList.contains("is-deleted"));
      if (!visibleCards.length) {
        createButton.style.top = "228px";
        return;
      }

      const lastCard = visibleCards[visibleCards.length - 1];
      const top = savedList.offsetTop + lastCard.offsetTop + lastCard.offsetHeight + 36;
      createButton.style.top = `${top}px`;
      document.querySelector(".mine-page").style.height = `${Math.max(932, top + 68)}px`;
    }

    statusButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const nextStatus = button.dataset.status;
        activeStatus = activeStatus === nextStatus ? "" : nextStatus;

        statusButtons.forEach((item) => {
          item.classList.toggle("is-active", item.dataset.status === activeStatus);
        });

        applyStatusFilter();
      });
    });

    syncSavedCards();
    applyStatusFilter();
    updateStatusCounts();
  </script>
</body>
</html>
