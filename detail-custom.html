<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/scrollbars.css">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF5EA">
  <title>兴趣详情</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "未命名兴趣";
    const saved = JSON.parse(localStorage.getItem("interestSavedList") || "[]").find((item) => item.name === name) || {};
    const toneClass = saved.tone === "green" ? "green" : saved.tone === "blue" ? "blue" : "";
    const category = saved.category || saved.tags?.[0] || "其他";
    const plan = /水彩|绘画|画画|素描|插画/.test(`${name}${category}`)
      ? [
          { period: "第1周", action: "熟悉水彩工具，练平涂与渐变", cost: "0-50元" },
          { period: "第2-4周", action: "临摹简单静物，练湿画法与叠色", cost: "50-100元" },
          { period: "第1-3月", action: "完成主题小画，建立个人配色", cost: "100-300元" }
        ]
      : [
          { period: "第1周", action: `认识${name}基础工具与入门动作`, cost: "0-100元" },
          { period: "第2-4周", action: `完成${name}基础练习，建立稳定习惯`, cost: "50-200元" },
          { period: "第1-3月", action: `完成一个${name}主题作品或阶段目标`, cost: "100-400元" }
        ];
    window.DETAIL_DATA = {
      name,
      category,
      toneClass,
      icon: saved.icon || "assets/icon-test.webp",
      fund: (saved.note || "启动资金：待补充").replace(/^启动资金：/, ""),
      tags: saved.tags || ["其他"],
      timeline: plan,
      gear: { low: { name: "基础装备", note: "按需准备即可" }, pro: { name: "进阶装备", note: "熟悉后再升级" } },
      resources: {
        video: [{ title: "添加你的第一条资源", image: "assets/resource-thumbs/custom-empty-resource.webp", placeholder: true, url: "#" }],
        article: [{ title: "添加你的第一条资源", image: "assets/resource-thumbs/custom-empty-resource.webp", placeholder: true, url: "#" }],
        creator: [{ title: "添加你的第一条资源", image: "assets/resource-thumbs/custom-empty-resource.webp", placeholder: true, url: "#" }]
      },
      places: []
    };
  </script>
  <script src="assets/detail-page-checkin-sync.js?v=position-sync-v1"></script>
</body>
</html>
