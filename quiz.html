<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF5EA">
  <title>测一测适合什么</title>
  <style>
    @font-face {
      font-family: "JiangChengYuanTi";
      src: url("assets/fonts/JiangChengYuanTi-400.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "JiangChengYuanTi";
      src: url("assets/fonts/JiangChengYuanTi-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "JiangChengYuanTi";
      src: url("assets/fonts/JiangChengYuanTi-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --page: #FDF5EA;
      --ink: #100F0F;
      --yellow: #FCD611;
      --label-yellow: #FDDE19;
      --green: #CDF12D;
      --blue: #10D8FD;
      --card-border: 2px solid #100F0F;
      --card-shadow: 2px 2px 0px #100F0F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: "JiangChengYuanTi", YouYuan, "幼圆", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button {
      color: inherit;
      font: inherit;
      border: 0;
      background: none;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .quiz-page {
      position: relative;
      width: 430px;
      height: 932px;
      flex: 0 0 430px;
      overflow: hidden;
      transform-origin: top center;
    }

    .quiz-page > :not(.back-link) {
      translate: 0 22px;
    }

    .back-link {
      position: absolute;
      left: 16px;
      top: 50px;
      width: 92px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--page);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 8px;
      font-weight: 500;
      font-size: 18px;
      line-height: 40px;
      z-index: 2;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .back-link:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #100F0F;
    }

    .back-link img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .back-link span {
      height: 18px;
      line-height: 18px;
    }

    .question-count {
      position: absolute;
      left: 16px;
      top: 96px;
      width: 110px;
      height: 18px;
      font-weight: 500;
      font-size: 18px;
      line-height: 18px;
    }

    .progress-percent {
      position: absolute;
      right: 16px;
      top: 96px;
      width: 48px;
      height: 18px;
      font-weight: 500;
      font-size: 18px;
      line-height: 18px;
      text-align: right;
    }

    .progress-track {
      position: absolute;
      left: 16px;
      top: 128px;
      width: 398px;
      height: 18px;
      background: var(--page);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--yellow);
      border-right: 2px solid var(--ink);
      transition: width 160ms ease;
    }

    .question-card {
      position: absolute;
      left: 16px;
      top: 184px;
      width: 398px;
      min-height: 166px;
    }

    .question-kicker {
      display: inline-block;
      margin-bottom: 16px;
      padding: 2px 6px;
      background: var(--green);
      border-radius: 3px;
      font-weight: 400;
      font-size: 16px;
      line-height: 16px;
    }

    .question-title {
      position: relative;
      font-weight: 600;
      font-size: 30px;
      line-height: 42px;
      z-index: 1;
    }

    .question-line {
      position: absolute;
      width: 322px;
      height: 9.71px;
      left: 0;
      top: 101px;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    .answer-list {
      position: absolute;
      left: 16px;
      top: 364px;
      display: grid;
      gap: 16px;
      width: 398px;
    }

    .answer-card {
      position: relative;
      width: 398px;
      height: 72px;
      background: var(--page);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 16px;
      font-weight: 500;
      font-size: 20px;
      line-height: 20px;
      text-align: left;
      padding-left: 24px;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .answer-card:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #100F0F;
    }

    .answer-card.is-picked {
      background: var(--yellow);
    }

    .answer-deco {
      position: absolute;
      object-fit: contain;
      pointer-events: none;
      z-index: 0;
    }

    .answer-deco-left {
      width: 30.8px;
      height: 30.8px;
      left: 18px;
      top: 640px;
      transform: rotate(-12deg);
    }

    .answer-deco-right {
      width: 68.64px;
      height: 68.64px;
      left: 344px;
      top: 270px;
      transform: rotate(18deg);
    }

    .quiz-actions {
      position: absolute;
      top: 628px;
      right: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      z-index: 3;
    }

    .quiz-action {
      min-width: 76px;
      min-height: 40px;
      padding: 11px 16px;
      background: var(--yellow);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 8px;
      font-weight: 500;
      font-size: 18px;
      line-height: 18px;
      text-align: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .quiz-action:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #100F0F;
    }

    .quiz-action:disabled {
      background: #D9D2C8;
      color: #7A746C;
      border-color: #7A746C;
      box-shadow: 2px 2px 0px #7A746C;
      cursor: not-allowed;
      transform: none;
    }

    .confirm-action {
      display: none;
    }

    .quiz-actions.is-final .confirm-action {
      display: inline-block;
    }

    .quiz-girl-group {
      position: absolute;
      width: 355px;
      height: 255px;
      left: 119px;
      top: 593px;
      pointer-events: none;
      z-index: 0;
    }

    .quiz-girl-supine {
      width: 355px;
      height: 255px;
      object-fit: contain;
    }

    .quiz-girl-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(254, 245, 234, 0.7) 0%, rgba(254, 245, 234, 0) 100%);
      z-index: 1;
    }

    @media (max-width: 430px) {
      .quiz-page {
        transform: scale(calc(100vw / 430));
      }

      body {
        height: calc(932px * (100vw / 430));
      }
    }
  </style>
</head>
<body>
  <main class="quiz-page" aria-label="测一测适合什么">
    <div class="quiz-girl-group" aria-hidden="true">
      <img class="quiz-girl-supine" src="assets/quiz-girl-supine.webp" alt="">
      <div class="quiz-girl-mask"></div>
    </div>

    <a class="back-link" href="index.html">
      <img src="assets/icon-arrow-left-s-line.svg" alt="" aria-hidden="true">
      <span>返回</span>
    </a>

    <div class="question-count">问题 <span class="current-index">1</span>/3</div>
    <div class="progress-percent">0%</div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>

    <section class="question-card" aria-labelledby="question-title">
      <span class="question-kicker">下班后</span>
      <h1 id="question-title" class="question-title">你更想<br>「动起来」还是「静下来」？</h1>
      <img class="question-line" src="assets/line2.webp" alt="" aria-hidden="true">
    </section>

    <img class="answer-deco answer-deco-right" src="assets/deco-sparkles.webp" alt="" aria-hidden="true">
    <img class="answer-deco answer-deco-left" src="assets/star4.svg" alt="" aria-hidden="true">

    <section class="answer-list" aria-label="选项">
      <button class="answer-card" type="button">动起来，想流汗释放压力</button>
      <button class="answer-card" type="button">静下来，想专注做点什么</button>
      <button class="answer-card" type="button">都可以，看心情</button>
    </section>

    <section class="quiz-actions" aria-label="答题操作">
      <button class="quiz-action prev-action" type="button" disabled>上一题</button>
      <button class="quiz-action confirm-action" type="button">确认</button>
    </section>

  </main>

  <script>
    const questions = [
      {
        kicker: "下班后",
        title: "你更想<br>「动起来」还是「静下来」？",
        answers: ["动起来，想流汗释放压力", "静下来，想专注做点什么", "都可以，看心情"],
      },
      {
        kicker: "周末安排",
        title: "你更想<br>「出门」还是「在家」？",
        answers: ["出门活动，顺便换换空气", "在家完成一个小作品", "都可以，关键别太贵"],
      },
      {
        kicker: "开始方式",
        title: "你希望兴趣<br>更偏「挑战」还是「治愈」？",
        answers: ["有一点挑战，会更有成就感", "轻松治愈，能让我放松", "先低成本试试再决定"],
      },
    ];

    const currentIndex = document.querySelector(".current-index");
    const progressPercent = document.querySelector(".progress-percent");
    const progressFill = document.querySelector(".progress-fill");
    const questionKicker = document.querySelector(".question-kicker");
    const questionTitle = document.querySelector(".question-title");
    const questionLine = document.querySelector(".question-line");
    const answerButtons = [...document.querySelectorAll(".answer-card")];
    const actionGroup = document.querySelector(".quiz-actions");
    const prevButton = document.querySelector(".prev-action");
    const confirmButton = document.querySelector(".confirm-action");
    const selectedAnswers = Array(questions.length).fill(null);
    let step = 0;

    function renderQuestion() {
      const question = questions[step];
      currentIndex.textContent = String(step + 1);
      const isFinalAnswered = step === questions.length - 1 && selectedAnswers[step] !== null;
      const percent = isFinalAnswered ? 100 : step === 0 ? 0 : Math.round((step / questions.length) * 100);
      progressPercent.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;
      questionKicker.textContent = question.kicker;
      questionTitle.innerHTML = question.title;
      questionLine.style.width = question.lineWidth || "322px";
      answerButtons.forEach((button, index) => {
        button.textContent = question.answers[index];
        button.classList.toggle("is-picked", selectedAnswers[step] === index);
      });
      prevButton.disabled = step === 0;
      actionGroup.classList.toggle("is-final", step === questions.length - 1);
      confirmButton.disabled = step === questions.length - 1 && selectedAnswers[step] === null;
    }

    answerButtons.forEach((button, index) => {
      button.addEventListener("click", () => {
        selectedAnswers[step] = index;
        renderQuestion();
        if (step < questions.length - 1) {
          window.setTimeout(() => {
            step += 1;
            renderQuestion();
          }, 160);
        }
      });
    });

    prevButton.addEventListener("click", () => {
      if (step === 0) return;
      step -= 1;
      renderQuestion();
    });

    confirmButton.addEventListener("click", () => {
      if (selectedAnswers[step] === null) return;
      window.location.href = "result.html";
    });

    renderQuestion();
  </script>
</body>
</html>
